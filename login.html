            <h1 id="titulo-login">Iniciar Sesión</h1>
            <p>Ingresa a tu cuenta para acceder a tus cursos.</p>

            <!-- Formulario preparado para el backend -->
            <form action="login.php" method="POST" id="formulario-login">
                <fieldset>
                    <legend>Datos de acceso</legend>
                    
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">

                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="********">

                    <button type="submit" class="boton-ver-recursos btn-formulario">Ingresar</button>
                </fieldset>
            </form>
            
            <p style="text-align: center; margin-top: 20px;">
                ¿No tienes cuenta? <a href="#" style="color: var(--azul-medio); font-weight: bold;">Regístrate aquí</a>
